name: CI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Démarrer et tester
        shell: bash
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000/api/health --timeout 60000
          npm run test:smoke
